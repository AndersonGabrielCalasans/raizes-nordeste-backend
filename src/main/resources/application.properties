quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH}
mp.jwt.verify.issuer=raizes-nordeste
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH}
smallrye.jwt.new-token.issuer=raizes-nordeste

quarkus.smallrye-openapi.info-title=Raízes do Nordeste - API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.swagger-ui.always-include=true
